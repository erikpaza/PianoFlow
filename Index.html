<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070B16">
<title>PianoFlow</title>
<style>
:root{--bg:#070B16;--bg2:#0D1530;--l:#7BA7D1;--r:#9CE15A;--dim:#8793B0;--tx:#EAF0FF}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,sans-serif}
#welcome{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(var(--bg2),var(--bg));z-index:5;overflow:hidden}
.fb{position:absolute;bottom:-60%;border-radius:6px;opacity:.16;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-190vh)}}
#welcome .c{position:relative;text-align:center;animation:in 1s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(20px)}}
.logo{display:flex;gap:6px;align-items:flex-end;justify-content:center;height:44px;margin-bottom:8px}
.logo i{width:8px;border-radius:3px;display:block}
h1{font-size:clamp(34px,9vh,56px);letter-spacing:4px;font-weight:200;background:linear-gradient(90deg,var(--l),var(--r));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 b{font-weight:700}
.sub{color:var(--dim);margin:6px 0 24px;font-size:16px}
.btn{border:0;border-radius:40px;padding:14px 34px;font-size:17px;font-weight:700;color:#0A1020;background:linear-gradient(90deg,var(--l),var(--r));box-shadow:0 0 26px rgba(156,225,90,.28);cursor:pointer}
#app{position:fixed;inset:0;display:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bar{position:absolute;left:0;right:0;top:0;display:flex;gap:16px;align-items:center;padding:6px 12px calc(10px);padding-left:max(12px,env(safe-area-inset-left));background:linear-gradient(rgba(7,11,22,.92),rgba(7,11,22,0));white-space:nowrap;overflow-x:auto}
#bar::-webkit-scrollbar{display:none}
#back{background:none;border:0;color:var(--tx);font-size:22px;padding:4px 8px}
.mic{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.8px;color:var(--dim)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dim)}
.on .dot{background:var(--r);box-shadow:0 0 10px var(--r)}.on{color:var(--r)}
.bad .dot{background:#D64545}.bad{color:#D64545}
#note{width:76px;font-size:30px;font-weight:300;color:var(--dim)}
.lv{width:90px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.lv i{display:block;height:100%;width:0;background:var(--l)}
#hz{width:60px;font-size:12px;color:var(--dim)}
.sl{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
input[type=range]{width:120px;accent-color:var(--r)}
#go{border:0;border-radius:20px;padding:9px 18px;font-weight:700;font-size:14px;background:var(--r);color:#0A1020}
#go.stop{background:#D64545;color:#fff}
#msg{position:absolute;left:0;right:0;top:0;bottom:30%;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);padding:0 30px;pointer-events:none;line-height:1.5}
#msg{white-space:pre-line}#msg.err{color:var(--tx)}
</style>
</head>
<body>
<div id="welcome">
  <div id="fbars"></div>
  <div class="c">
    <div class="logo"><i style="height:18px;background:var(--l)"></i><i style="height:34px;background:var(--l)"></i><i style="height:26px;background:var(--r)"></i><i style="height:40px;background:var(--r)"></i><i style="height:22px;background:var(--r)"></i></div>
    <h1>Piano<b>Flow</b></h1>
    <p class="sub">Transforme cada nota em movimento.</p>
    <button class="btn" id="start">🎹 Começar a tocar</button>
  </div>
</div>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="msg"></div>
  <div id="bar">
    <button id="back" aria-label="Voltar">‹</button>
    <div class="mic" id="mic"><span class="dot"></span><span id="miclbl">MIC DESLIGADO</span></div>
    <div id="note">—</div>
    <div class="lv"><i id="lvl"></i></div>
    <div id="hz">— Hz</div>
    <div class="sl">🎚 <input type="range" id="sens" min="0" max="1" step="0.01" value="0.5"> Sensib.</div>
    <button id="go">Iniciar escuta</button>
  </div>
</div>

<script>
'use strict';
// ---------- constantes ----------
const N = 8192, HALF = N / 2, MIN_M = 36, MAX_M = 96, SPLIT = 60, TRAVEL = 3500;
const COL = {l:'#7BA7D1', ld:'#3F6F9E', r:'#9CE15A', rd:'#5C9E1E'};
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const isBlack = m => [1,3,6,8,10].includes(m % 12);
const mFreq = m => 440 * Math.pow(2, (m - 69) / 12);
const mName = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
const hc = m => m < SPLIT ? COL.l : COL.r;
const hcd = m => m < SPLIT ? COL.ld : COL.rd;

// ---------- FFT ----------
const fcos = new Float64Array(HALF), fsin = new Float64Array(HALF), frev = new Int32Array(N);
for (let i = 0; i < HALF; i++) { const a = -2 * Math.PI * i / N; fcos[i] = Math.cos(a); fsin[i] = Math.sin(a); }
for (let i = 0, bits = Math.log2(N); i < N; i++) { let r = 0, x = i; for (let b = 0; b < bits; b++) { r = (r << 1) | (x & 1); x >>= 1; } frev[i] = r; }
function fft(re, im) {
  for (let i = 0; i < N; i++) { const j = frev[i]; if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
  for (let size = 2; size <= N; size <<= 1) {
    const half = size >> 1, step = N / size;
    for (let s = 0; s < N; s += size) {
      for (let k = 0, t = 0; k < half; k++, t += step) {
        const i = s + k, j = i + half, wr = fcos[t], wi = fsin[t];
        const xr = re[j] * wr - im[j] * wi, xi = re[j] * wi + im[j] * wr;
        re[j] = re[i] - xr; im[j] = im[i] - xi; re[i] += xr; im[i] += xi;
      }
    }
  }
}

// ---------- detector polifônico (mesmo algoritmo do app Flutter) ----------
const win = new Float64Array(N); for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N);
const RE = new Float64Array(N), IM = new Float64Array(N), SPEC = new Float64Array(HALF), RES = new Float64Array(HALF);
const W = [1.0, 0.9, 0.7, 0.5, 0.4, 0.3], DECAY = 0.6;
const LR = Math.pow(2, -0.35 / 12), HR = Math.pow(2, 0.35 / 12);
let binHz = 44100 / N, sr = 44100;
const rng = hz => [Math.max(1, Math.floor(hz * LR / binHz)), Math.min(HALF - 2, Math.ceil(hz * HR / binHz))];
function peak(a, hz) { const [lo, hi] = rng(hz); let m = 0; for (let i = lo; i <= hi; i++) if (a[i] > m) m = a[i]; return m; }

function detect(x, sens) {
  let sum = 0; for (let i = 0; i < N; i++) sum += x[i] * x[i];
  const rms = Math.sqrt(sum / N);
  if (rms < 0.03 - 0.026 * sens) return { rms, top: 0, notes: [] };
  for (let i = 0; i < N; i++) { RE[i] = x[i] * win[i]; IM[i] = 0; }
  fft(RE, IM);
  for (let i = 0; i < HALF; i++) { SPEC[i] = Math.hypot(RE[i], IM[i]); RES[i] = SPEC[i]; }
  const lo = Math.floor(60 / binHz), hi = Math.floor(5000 / binHz);
  let ms = 0; for (let i = lo; i < hi; i++) ms += SPEC[i];
  const minSal = (ms / (hi - lo)) * (40 - 28 * sens);
  const notes = [], picked = [], nyq = sr / 2 * 0.95;
  let first = 0;
  for (let it = 0; it < 6; it++) {
    let best = -1, bs = 0, bf = 0;
    for (let m = MIN_M; m <= MAX_M; m++) {
      const fr = mFreq(m); let s = 0, mx = 0, f1 = 0;
      for (let h = 1; h <= 6; h++) {
        const fh = fr * h; if (fh >= nyq) break;
        const p = peak(RES, fh); if (h === 1) f1 = p; if (p > mx) mx = p; s += W[h - 1] * p;
      }
      if (f1 < 0.25 * mx) continue;
      if (s > bs) { bs = s; best = m; bf = f1; }
    }
    if (best < 0) break;
    if (first === 0) { first = bs; if (bs < minSal) break; }
    else if (bs < Math.max(minSal, 0.2 * first)) break;
    const fr = mFreq(best), orig = peak(SPEC, fr);
    const ghost = picked.some(([pm, pf]) => [12, 19, 24].includes(best - pm) && orig < 0.6 * pf);
    if (!ghost) { picked.push([best, orig]); notes.push({ midi: best, strength: orig }); }
    for (let h = 1; h <= 6; h++) {
      const fh = fr * h; if (fh >= nyq) break;
      let [a, b] = rng(fh);
      if (h === 1) { a = Math.max(1, a - 1); b = Math.min(HALF - 2, b + 1); for (let i = a; i <= b; i++) RES[i] = 0; }
      else {
        let p = 0; for (let i = a; i <= b; i++) if (RES[i] > p) p = RES[i];
        if (p > 0) { const r = Math.min(1, bf * Math.pow(DECAY, h - 1) / p); for (let i = a; i <= b; i++) RES[i] *= (1 - r); }
      }
    }
  }
  // frequência dominante
  const l2 = Math.max(1, Math.floor(60 / binHz)), h2 = Math.min(HALF - 2, Math.floor(4200 / binHz));
  let k = l2; for (let i = l2; i <= h2; i++) if (SPEC[i] > SPEC[k]) k = i;
  const A = SPEC[k - 1], B = SPEC[k], C = SPEC[k + 1], d = A - 2 * B + C;
  return { rms, top: (k + (d === 0 ? 0 : 0.5 * (A - C) / d)) * binHz, notes };
}

// ---------- onset / offset ----------
const states = new Map();
function track(notes, vel) {
  const ev = [], seen = new Map(notes.map(n => [n.midi, n.strength]));
  for (const [midi, str] of seen) {
    let st = states.get(midi); if (!st) { st = { on: false, seen: 0, missed: 0, age: 0, last: 0 }; states.set(midi, st); }
    st.missed = 0;
    if (!st.on) { if (++st.seen >= 2) { st.on = true; st.age = 0; ev.push(['on', midi, vel]); } }
    else if (++st.age >= 4 && st.last > 0 && str > st.last * 1.8) { ev.push(['off', midi], ['on', midi, vel]); st.age = 0; }
    st.last = str;
  }
  for (const [midi, st] of [...states]) {
    if (seen.has(midi)) continue;
    if (!st.on) { states.delete(midi); continue; }
    if (++st.missed >= 3) { ev.push(['off', midi]); states.delete(midi); }
  }
  return ev;
}

// ---------- estado e áudio ----------
const $ = id => document.getElementById(id);
const notes = [], active = new Map();
let ctx, analyser, stream, listening = false, sens = 0.5, lastMidi = null, level = 0, hz = 0, denied = false, lastFrame = 0;
const buf = new Float32Array(N);

function setMsg(t, err) { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; }
function setMic() {
  const m = $('mic'); m.className = 'mic ' + (listening ? 'on' : denied ? 'bad' : '');
  $('miclbl').textContent = listening ? 'MIC ATIVO' : denied ? 'SEM PERMISSÃO' : 'MIC DESLIGADO';
  $('go').textContent = listening ? 'Parar' : 'Iniciar escuta'; $('go').className = listening ? 'stop' : '';
}
async function ensureMic() {
  if (stream) return true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    sr = ctx.sampleRate; binHz = sr / N;
    analyser = ctx.createAnalyser(); analyser.fftSize = N; analyser.smoothingTimeConstant = 0;
    ctx.createMediaStreamSource(stream).connect(analyser);
    denied = false; return true;
  } catch (e) {
    denied = true; stream = null;
    setMsg('O PianoFlow precisa do microfone para ouvir o piano.\nLibere a permissão do microfone para este site/arquivo no navegador e toque em "Iniciar escuta" de novo.\n(' + (e.name || 'erro') + ')', true);
    return false;
  }
}
async function toggle() {
  if (listening) { stop(); return; }
  if (!(await ensureMic())) { setMic(); return; }
  if (ctx.state === 'suspended') await ctx.resume();
  listening = true; setMsg('Ouvindo… toque uma tecla no seu piano'); setMic();
}
function stop() {
  listening = false; const now = performance.now();
  for (const n of active.values()) n.end = now;
  active.clear(); states.clear(); level = 0; hz = 0; setMic();
  setMsg('Toque em "Iniciar escuta" e comece a tocar');
}
function frame(now) {
  if (listening && now - lastFrame >= 46) {
    lastFrame = now;
    analyser.getFloatTimeDomainData(buf);
    const r = detect(buf, sens);
    const l = Math.min(1, r.rms * 5); level = l > level ? l : level * 0.85 + l * 0.15; hz = r.top;
    for (const e of track(r.notes, Math.max(0.35, Math.min(1, r.rms * 6)))) {
      if (e[0] === 'on') {
        const p = active.get(e[1]); if (p) p.end = now;
        const n = { midi: e[1], start: now, vel: e[2], end: null }; notes.push(n); active.set(e[1], n); lastMidi = e[1];
      } else { const p = active.get(e[1]); if (p) { p.end = now; active.delete(e[1]); } }
    }
  }
  draw(now); requestAnimationFrame(frame);
}

// ---------- desenho ----------
const cv = $('cv'), g = cv.getContext('2d');
let W_ = 0, H_ = 0, KH = 0, whiteW = 0, rects = {};
function layout() {
  const d = window.devicePixelRatio || 1;
  W_ = innerWidth; H_ = innerHeight; cv.width = W_ * d; cv.height = H_ * d; g.setTransform(d, 0, 0, d, 0, 0);
  KH = Math.min(150, Math.max(80, H_ * 0.3));
  let wh = 0; for (let m = MIN_M; m <= MAX_M; m++) if (!isBlack(m)) wh++;
  whiteW = W_ / wh; const bw = whiteW * 0.6, bh = KH * 0.62; let idx = 0; rects = {};
  for (let m = MIN_M; m <= MAX_M; m++) {
    if (isBlack(m)) rects[m] = { x: idx * whiteW - bw / 2, w: bw, h: bh, b: true };
    else { rects[m] = { x: idx * whiteW, w: whiteW, h: KH, b: false }; idx++; }
  }
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }
function draw(now) {
  const rh = H_ - KH, ppm = rh / TRAVEL;
  g.fillStyle = '#070B16'; g.fillRect(0, 0, W_, H_);
  const gr = g.createLinearGradient(0, 0, 0, rh); gr.addColorStop(0, '#070B16'); gr.addColorStop(1, '#0D1530');
  g.fillStyle = gr; g.fillRect(0, 0, W_, rh);
  g.lineWidth = 1;
  for (let m = MIN_M; m <= MAX_M; m++) { const r = rects[m]; if (r.b) continue; g.strokeStyle = m % 12 === 0 ? 'rgba(255,255,255,.1)' : 'rgba(255,255,255,.035)'; g.beginPath(); g.moveTo(r.x, 0); g.lineTo(r.x, rh); g.stroke(); }
  g.strokeStyle = 'rgba(255,255,255,.055)';
  for (let t = Math.floor((now - TRAVEL) / 1000) * 1000; t <= now; t += 1000) { const y = rh - (now - t) * ppm; if (y >= 0 && y <= rh) { g.beginPath(); g.moveTo(0, y); g.lineTo(W_, y); g.stroke(); } }
  for (let i = notes.length - 1; i >= 0; i--) if (notes[i].end !== null && now - notes[i].end > 4200) notes.splice(i, 1);
  for (const n of notes) {
    const r = rects[n.midi]; if (!r) continue;
    const yb = rh - (now - (n.end ?? now)) * ppm; if (yb < 0) continue;
    let yt = Math.max(0, rh - (now - n.start) * ppm); if (yb - yt < 5) yt = yb - 5;
    const x = r.x + (r.b ? 1 : 2), w = r.w - (r.b ? 2 : 4);
    g.globalAlpha = 0.75 + 0.25 * n.vel; g.fillStyle = hc(n.midi); rr(x, yt, w, yb - yt, 5); g.fill();
    g.globalAlpha = 1; g.strokeStyle = '#1A1F2B'; g.lineWidth = 1.4; g.stroke();
  }
  for (const m of active.keys()) {
    const r = rects[m]; if (!r) continue; const cx = r.x + r.w / 2;
    const rg = g.createRadialGradient(cx, rh, 0, cx, rh, 34); rg.addColorStop(0, 'rgba(255,255,255,.8)'); rg.addColorStop(.4, hc(m) + '46'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(cx - 34, rh - 34, 68, 68);
  }
  // teclado
  g.save(); g.translate(0, rh);
  g.lineWidth = 1;
  for (let m = MIN_M; m <= MAX_M; m++) {
    const r = rects[m]; if (r.b) continue;
    g.fillStyle = active.has(m) ? hc(m) : '#FFFDF0'; g.fillRect(r.x, 0, r.w, r.h);
    g.strokeStyle = '#B9B5A5'; g.strokeRect(r.x + .5, .5, r.w - 1, r.h - 1);
    if (m % 12 === 0) { g.fillStyle = '#8A8A80'; g.font = '600 10px system-ui'; g.fillText(mName(m), r.x + 2, r.h - 5); }
  }
  for (let m = MIN_M; m <= MAX_M; m++) {
    const r = rects[m]; if (!r.b) continue;
    g.fillStyle = active.has(m) ? hcd(m) : '#121212'; g.fillRect(r.x, 0, r.w, r.h);
    if (!active.has(m)) { g.fillStyle = 'rgba(255,255,255,.09)'; g.fillRect(r.x + 2, 0, r.w - 4, r.h * .7); }
  }
  g.fillStyle = '#C0392B'; g.fillRect(0, 0, W_, 3);
  g.restore();
  $('msg').style.opacity = (notes.length && !denied) ? 0 : 1;
  $('lvl').style.width = (level * 100) + '%'; $('hz').textContent = hz > 0 ? Math.round(hz) + ' Hz' : '— Hz';
  const nt = $('note'); if (lastMidi !== null) { nt.textContent = mName(lastMidi); nt.style.color = hc(lastMidi); }
}

// ---------- boot ----------
for (let i = 0; i < 16; i++) {
  const d = document.createElement('div'); d.className = 'fb';
  d.style.cssText = `left:${Math.random() * 96}%;width:${10 + Math.random() * 18}px;height:${14 + Math.random() * 28}vh;background:${Math.random() < .5 ? COL.l : COL.r};animation-duration:${14 + Math.random() * 18}s;animation-delay:-${Math.random() * 20}s`;
  $('fbars').appendChild(d);
}
$('start').onclick = async () => {
  $('welcome').style.display = 'none'; $('app').style.display = 'block';
  try { const el = document.documentElement; if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' }); } catch (e) {}
  try { await screen.orientation.lock('landscape'); } catch (e) {}
  layout(); setMsg('Toque em "Iniciar escuta" e comece a tocar'); setMic();
  ensureMic().then(ok => { if (!ok) setMic(); });
};
$('back').onclick = () => { if (listening) stop(); $('app').style.display = 'none'; $('welcome').style.display = 'flex'; };
$('go').onclick = toggle;
$('sens').oninput = e => { sens = +e.target.value; };
addEventListener('resize', layout);
requestAnimationFrame(frame);
</script>
</body>
</html>
